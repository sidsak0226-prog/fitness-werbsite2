
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Meal Planner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: #1a1a1a;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(255,255,255,0.05);
      padding: 30px;
      text-align: center;
      animation: fadeIn 1s ease;
      border: 1px solid #333;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      color: #fff;
      letter-spacing: 1px;
    }

    p {
      color: #ccc;
      margin-bottom: 20px;
    }

    select {
      padding: 12px 15px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #111;
      color: #fff;
      font-size: 16px;
      width: 80%;
      outline: none;
      margin-bottom: 15px;
      transition: 0.3s;
    }

    select:focus {
      border-color: #fff;
    }

    button {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
      font-weight: 600;
    }

    button:hover {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      transform: scale(1.05);
    }

    .meal-plan {
      margin-top: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .meal-card {
      background: #fff;
      color: #000;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(255,255,255,0.05);
      transition: 0.3s;
    }

    .meal-card:hover {
      transform: translateY(-5px);
      background: #f0f0f0;
    }

    .meal-card h3 {
      margin-bottom: 8px;
      font-size: 18px;
      color: #000;
    }

    .meal-card p {
      color: #333;
      font-size: 15px;
    }

    @media (max-width: 600px) {
      .meal-plan {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🥗 Fitness Meal Planner</h1>
    <p>Select your fitness goal to get your perfect plan</p>

    <select id="goal">
      <option value="weight_loss">🏃‍♂️ Weight Loss</option>
      <option value="muscle_gain">💪 Muscle Gain</option>
      <option value="maintenance">⚖️ Maintenance</option>
    </select><br>
    <button onclick="generateMealPlan()">Generate Plan</button>

    <div id="meal-plan" class="meal-plan"></div>
  </div>

  <script>
    const mealPlans = {
      weight_loss: {
        Breakfast: "Oatmeal with banana & almonds",
        Lunch: "Grilled chicken salad with olive oil dressing",
        Dinner: "Steamed fish with brown rice and veggies",
        Snacks: "Green tea with nuts or apple"
      },
      muscle_gain: {
        Breakfast: "Scrambled eggs with whole grain toast",
        Lunch: "Grilled chicken with sweet potato and broccoli",
        Dinner: "Salmon with quinoa and spinach",
        Snacks: "Protein shake with peanut butter"
      },
      maintenance: {
        Breakfast: "Greek yogurt with berries",
        Lunch: "Turkey sandwich on whole wheat bread",
        Dinner: "Lean beef stir-fry with rice and vegetables",
        Snacks: "Trail mix or smoothie"
      }
    };

    function generateMealPlan() {
      const goal = document.getElementById("goal").value;
      const plan = mealPlans[goal];
      const container = document.getElementById("meal-plan");
      container.innerHTML = "";

      for (const [meal, food] of Object.entries(plan)) {
        const card = document.createElement("div");
        card.classList.add("meal-card");
        card.innerHTML = `
          <h3>${meal}</h3>
          <p>${food}</p>
        `;
        container.appendChild(card);
      }
    }
  </script>
</body>
</html>
